<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Web template" />
        <title>Simple Web Page</title>
        <link rel="stylesheet" href="styles.css" />

        <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0-beta6/dist/htmx.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0-beta6/dist/ext/hx-sse.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0-beta6/dist/ext/hx-ws.min.js"></script>
    </head>

    <body>
        <div class="container">
            <h1>SSE Demo Page</h1>

            <!-- Auto-connects on load, streams messages into the div -->
            <div hx-sse:connect="/stream" hx-target="#count">
                <span>Count: </span>
                <span id="count">Waiting for messages...</span>
            </div>

            <img
                src="image.png"
                width="100"
                alt="A sample PNG image"
                class="centered-image"
            />
            <a href="/websocket">WebSocket Demo Page</a>
        </div>
    </body>
</html>
